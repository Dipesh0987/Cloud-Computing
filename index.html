<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Movie Reviews</title>
  </head>
  <body>

    <div class="app-wrapper">

      <!-- Header -->
      <div class="app-header">
        <h1>Movie Reviews</h1>
      </div>

      <!-- Add Movie Form -->
      <div class="form-card">
        <h5 class="form-title">Add a Review</h5>
        <div class="form-grid">
          <div class="form-group-item">
            <label for="movie_name">Movie Name</label>
            <input type="text" class="form-control" id="movie_name" placeholder="e.g. Inception">
          </div>
          <div class="form-group-item">
            <label for="director">Director</label>
            <input type="text" class="form-control" id="director" placeholder="e.g. Christopher Nolan" autocomplete="off">
          </div>
          <div class="form-group-item">
            <label for="release_date">Release Date</label>
            <input type="text" class="form-control" id="release_date" placeholder="YYYY-MM-DD" maxlength="10" autocomplete="off">
          </div>
          <div class="form-group-item">
            <label for="rating">Rating</label>
            <select class="form-control" id="rating">
              <option value="0">0/5</option>
              <option value="1">1/5</option>
              <option value="2">2/5</option>
              <option value="3" selected>3/5</option>
              <option value="4">4/5</option>
              <option value="5">5/5</option>
            </select>
          </div>
        </div>
        <div class="form-footer">
          <button type="button" class="btn-add" id="addButton">
            <i class="fas fa-plus"></i> Add Movie
          </button>
          <span id="formMessage" class="form-message"></span>
        </div>
      </div>

      <!-- Sort Bar -->
      <div class="sort-bar">
        <span class="sort-label">Sort by:</span>
        <div class="sort-dropdown-wrap">
          <button class="sort-dropdown-btn" id="sortDropdownBtn">
            <span id="sortLabel">A-Z</span>
            <i class="fas fa-arrow-up sort-dir-icon" id="sortDirIcon"></i>
            <i class="fas fa-chevron-down sort-chevron"></i>
          </button>
          <div class="sort-dropdown-menu" id="sortDropdownMenu">
            <div class="sort-option" data-sort="movie_name">A-Z</div>
            <div class="sort-option" data-sort="director">Director</div>
            <div class="sort-option" data-sort="release_date">Date</div>
            <div class="sort-option" data-sort="rating">Rating</div>
          </div>
        </div>
      </div>

      <!-- Reviews Table -->
      <div class="table-card">
        <div class="table-header">
          <span id="mainTitle">My Movies</span>
        </div>
        <table class="table table-striped mb-0">
          <thead>
            <tr>
              <th>Movie Name</th>
              <th>Rating</th>
              <th>Director</th>
              <th>Release Date</th>
              <th style="width: 100px">Actions</th>
            </tr>
          </thead>
          <tbody id="reviewList"></tbody>
        </table>
      </div>

    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="myscripts.js"></script>
  </body>
</html>
