<!-- index.html - kept simple -->
<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">

    <title>My Firebase app</title>
  </head>
  <body>
    <div class="d-flex mb-2">
      <input type="text" class="form-control" id="movie_name" placeholder="Movie name">
      <select class="form-control mx-2 w-25" id="rating">
        <option value="1">1/5</option>
        <option value="2">2/5</option>
        <option value="3">3/5</option>
        <option value="4">4/5</option>
        <option value="5">5/5</option>
      </select>
      <button type="button" class="btn btn-primary" id="addButton">Add</button>
    </div>

    <!-- Row for director and release date -->
    <div class="d-flex mb-3">
      <input type="text" class="form-control" id="director" placeholder="Director name">
      <input type="date" class="form-control mx-2" id="release_date">
      <div class="w-25"></div>
    </div>

    <div class="container">
      <div class="d-flex justify-content-between align-items-center">
        <h1 id="mainTitle">My Movies</h1>
        <button type="button" class="btn btn-outline-secondary" id="sortButton">
          <i class="fas fa-sort"></i> Sort A-Z
        </button>
      </div>
      <table class="table table-striped">
        <thead>
          <tr>
            <th>Movie Name</th>
            <th>Rating</th>
            <th>Director</th>
            <th>Release Date</th>
            <th style="width: 100px">Actions</th>
          </tr>
        </thead>
        <tbody id="reviewList">
        </tbody>
      </table>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    
    <script type="module" src="myscripts.js"></script>
  </body>
</html>
